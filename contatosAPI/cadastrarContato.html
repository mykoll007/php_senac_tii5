<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Contato</title>
    <style>
        body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
}

h1, h2 {
    color: #333;
}

#contacts-container {
    margin-bottom: 20px;
}

#contacts-list {
    list-style-type: none;
    padding: 0;
}

#contacts-list li {
    margin-bottom: 10px;
}

#form-container {
    border-top: 1px solid #ccc;
    padding-top: 20px;
}

label {
    display: inline-block;
    width: 80px;
    font-weight: bold;
}

input[type="text"],
input[type="email"] {
    width: 200px;
    margin-bottom: 10px;
}

button {
    padding: 5px 10px;
    background-color: #007bff;
    color: #fff;
    border: none;
    cursor: pointer;
}

button:hover {
    background-color: #0056b3;
}
    </style>
    
</head>
<body>
    <div class="container">
        <h1>Cadastro de Contato</h1>
        
        <form id="contactForm">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required><br><br>

            <label for="telefone">Telefone:</label>
            <input type="text" id="telefone" name="telefone" required><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>

            <button type="submit">Cadastrar</button>
        </form>

        <div id='message'></div>
    </div>

    <script>
        document.getElementById('contactForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const nome = document.getElementById('nome').value;
            const telefone = document.getElementById('telefone').value;
            const email = document.getElementById('email').value;

            fetch('api.php?action=add', {
                method: 'POST',
                body: JSON.stringify({nome, telefone, email}),
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => response.json())
            .then(data => {
                if(data.success) {
                    document.getElementById('message').innerHTML = 'Contato cadastrado com sucesso';
                    document.getElementById('contactForm').reset();
                } else {
                    document.getElementById('message').innerText = data.error ? data.error : 'Erro ao cadastrar o contato. Por favor, tente novamente.'
                }
            })
            .catch(error => console.error('Erro ao cadastrar contato', error));
        });
    </script>
</body>
</html>
